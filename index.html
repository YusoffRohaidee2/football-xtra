<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football XTRA | Sports Hub Official</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#080C14',
                            sidebar: '#0F1523',
                            card: '#161F33',
                            hover: '#1F2B47',
                            border: '#232E47',
                            accent: '#00E5FF',
                            neon: '#10B981',
                            gold: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #080C14;
            color: #F3F4F6;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .pulse-live {
            animation: pulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.95); }
        }
        /* Customizing Video.js player dimensions and styling */
        .video-js {
            width: 100% !important;
            height: 100% !important;
            background-color: #000;
        }
        .vjs-matrix.video-js {
            color: #00E5FF;
        }
        .vjs-matrix .vjs-big-play-button {
            border-color: #00E5FF;
            background-color: rgba(0, 229, 255, 0.2);
            border-radius: 50%;
            width: 2.2em;
            height: 2.2em;
            line-height: 2.2em;
            margin-left: -1.1em;
            margin-top: -1.1em;
        }
        .vjs-matrix .vjs-play-progress {
            background-color: #00E5FF;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #080C14;
        }
        ::-webkit-scrollbar-thumb {
            background: #232E47;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00E5FF;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Top Bar Header -->
    <header class="h-16 border-b border-brand-border bg-brand-sidebar/90 backdrop-blur sticky top-0 z-40 px-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <!-- Mobile Menu Toggle Button -->
            <button onclick="toggleSidebar()" class="lg:hidden p-2 text-gray-400 hover:text-white rounded-lg hover:bg-brand-card" aria-label="Toggle Navigation Menu">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-emerald-400 flex items-center justify-center text-black font-extrabold shadow-md shadow-cyan-500/20">
                    <i class="fa-solid fa-bolt text-sm"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-wider bg-gradient-to-r from-white via-cyan-200 to-cyan-400 bg-clip-text text-transparent leading-none">
                        FOOTBALL <span class="text-cyan-400">XTRA</span>
                    </h1>
                    <span class="text-[9px] tracking-widest text-gray-400 uppercase font-semibold block mt-0.5">Sports Hub Official</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold">
                <span class="w-2 h-2 rounded-full bg-red-500 pulse-live"></span>
                <span>LIVE STREAM</span>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">

        <!-- Mobile Sidebar Overlay -->
        <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/70 z-40 hidden lg:hidden backdrop-blur-sm"></div>

        <!-- LEFT SIDEBAR: Segments & Channels -->
        <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-50 w-80 bg-brand-sidebar border-r border-brand-border flex flex-col transition-transform duration-300 -translate-x-full lg:translate-x-0">
            
            <div class="p-4 border-b border-brand-border flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-cyan-400">
                    <i class="fa-solid fa-list-ul"></i> Stream Segments
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-gray-400 hover:text-white" aria-label="Close Sidebar">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Search Input -->
            <div class="p-3 border-b border-brand-border">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" id="channelSearch" oninput="filterChannels()" placeholder="Search channels..." 
                        class="w-full bg-brand-card border border-brand-border rounded-lg pl-8 pr-3 py-1.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition">
                </div>
            </div>

            <!-- Segments List -->
            <div class="flex-1 overflow-y-auto p-3 space-y-6" id="sidebarContent">
                
                <!-- SEGMENT 1 -->
                <div class="segment-group" data-segment="seg1">
                    <div class="flex items-center justify-between mb-2 px-1">
                        <span class="text-xs font-extrabold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-amber-400"></span> Segment 1
                        </span>
                        <span class="text-[10px] bg-amber-500/10 text-amber-300 px-1.5 py-0.5 rounded border border-amber-500/20 font-semibold">Live Channels</span>
                    </div>
                    <div class="space-y-1.5" id="list-seg1"></div>
                </div>

            </div>

            <div class="p-3 border-t border-brand-border bg-brand-card/50 text-[11px] text-gray-400 flex items-center justify-between">
                <span class="flex items-center gap-1.5 text-emerald-400">
                    <i class="fa-solid fa-circle-check text-[10px]"></i> Video.js Engine Active
                </span>
                <span class="text-gray-500">v8.10.0</span>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 overflow-y-auto p-4 lg:p-6 flex flex-col items-center">
            
            <div class="w-full max-w-4xl space-y-4">
                
                <!-- Player Title Header -->
                <div class="flex flex-wrap items-center justify-between gap-2 px-1">
                    <div class="flex items-center gap-2.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                        <h2 id="currentChannelTitle" class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                            Select a Channel From The Left Sidebar To Start Streaming
                        </h2>
                    </div>
                    <div id="channelBadge" class="hidden px-2 py-0.5 rounded bg-cyan-500/20 border border-cyan-500/40 text-cyan-300 text-xs font-medium">
                        HD LIVE
                    </div>
                </div>

                <!-- Compact Video Player Frame -->
                <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-black border border-brand-border shadow-2xl group">
                    
                    <!-- Video.js HTML5 Video Player -->
                    <div id="videojs-wrapper" class="w-full h-full hidden">
                        <video id="videojs-player" class="video-js vjs-big-play-centered vjs-matrix" controls preload="auto" crossorigin="anonymous">
                            <p class="vjs-no-js">
                                To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video.
                            </p>
                        </video>
                    </div>
                    
                    <!-- iFrame Player Container -->
                    <iframe id="iframePlayer" class="w-full h-full border-0 hidden" allowfullscreen allow="autoplay; encrypted-media"></iframe>

                    <!-- Initial Placeholder Screen -->
                    <div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-gradient-to-b from-gray-900/90 to-brand-dark">
                        <div class="w-16 h-16 rounded-full bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center mb-3 group-hover:scale-105 transition duration-300">
                            <i class="fa-solid fa-play text-2xl text-cyan-400 ml-1"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">Live Sports Broadcast</h3>
                        <p class="text-xs text-gray-400 max-w-sm">
                            Please select any channel from the left sidebar.
                        </p>
                    </div>
                </div>

                <!-- Player Control Buttons -->
                <div class="flex items-center justify-between bg-brand-card px-4 py-2.5 rounded-xl border border-brand-border text-xs text-gray-400">
                    <div class="flex items-center gap-4">
                        <button onclick="refreshCurrentStream()" class="hover:text-cyan-400 flex items-center gap-1.5 transition">
                            <i class="fa-solid fa-rotate-right"></i> Reload Stream
                        </button>
                        <button onclick="toggleFullscreen()" class="hover:text-cyan-400 flex items-center gap-1.5 transition">
                            <i class="fa-solid fa-expand"></i> Fullscreen
                        </button>
                    </div>
                    <div class="flex items-center gap-2 text-gray-400">
                        <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                        <span>Video.js HLS Engine</span>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- Video.js JS Library -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // Data Structure for Segments and Channels
        const channelsData = {
            seg1: [
                { id: 'seg1-spotv', name: "SPOTV Asia", type: "m3u8", src: "https://iptv.lancartech.co.id:443/Wawan007/Wawan1234/84.m3u8", tag: "Live" },
                { id: 'seg1-indosiar', name: "Indosiar Digital FHD", type: "m3u8", src: "https://footfytv.pro/proxy/direct?url=http://202.150.172.59/Indosiar/index.m3u8", tag: "Indonesia" },
                { id: 'seg1-nbc', name: "NBC Universo", type: "m3u8", src: "https://tv.topmediatv.net:25463/live/TopMediaWeb/bOteTR8ED1/88.m3u8", tag: "Live" },
                { id: 'seg1-bein1', name: "beIN Sports 1 Arabia HD", type: "m3u8", src: "https://cp11.adabmedia.com/hls2/bein1.m3u8", tag: "Live" },
                { id: 'seg1-sony2', name: "Sony Sports Ten 2", type: "m3u8", src: "https://footfytv.pro/proxy/direct?url=http://103.151.60.162:2122/play/a01b/index.m3u8?hls", tag: "Live" },
                { id: 'seg1-fs1', name: "FS1 USA", type: "m3u8", src: "https://footfytv.pro/proxy/direct?url=http://85.237.89.160:9590/usa-s/FOX-SPORTS-1/index.m3u8", tag: "Live" },
                { id: 'seg1-rcti', name: "RCTI Digital FHD", type: "m3u8", src: "https://footfytv.pro/proxy/direct?url=http://202.150.172.59/RCTIHD/index.m3u8", tag: "Indonesia" },
                { id: 'seg1-gtv', name: "GTV Digital FHD", type: "m3u8", src: "https://footfytv.pro/proxy/direct?url=http://202.150.172.59/GTVHD/index.m3u8", tag: "Indonesia" },
                { id: 'seg1-inews', name: "iNews Digital FHD", type: "m3u8", src: "https://footfytv.pro/proxy/direct?url=http://202.150.172.59/iNews/index.m3u8", tag: "Indonesia" },
                { id: 'seg1-antv', name: "ANTV Digital FHD", type: "m3u8", src: "https://iptv.lancartech.co.id:443/Wawan007/Wawan1234/1.m3u8", tag: "Indonesia" }
            ]
        };

        let currentActiveStream = null;
        let vjsPlayer = null;

        // Render Sidebar Channels dynamically
        function renderSidebarChannels() {
            Object.keys(channelsData).forEach(segKey => {
                const container = document.getElementById(`list-${segKey}`);
                if (!container) return;

                container.innerHTML = channelsData[segKey].map(channel => `
                    <button id="btn-${channel.id}" onclick="playStream('${segKey}', '${channel.id}')" 
                        class="channel-btn w-full px-3 py-2 rounded-lg bg-brand-card hover:bg-brand-hover border border-brand-border hover:border-cyan-500/40 transition flex items-center justify-between text-left group">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <i class="${channel.type === 'm3u8' ? 'fa-solid fa-play text-cyan-400' : 'fa-solid fa-tv text-amber-400'} text-xs shrink-0"></i>
                            <span class="text-xs font-semibold text-gray-200 truncate group-hover:text-white">${channel.name}</span>
                        </div>
                        <span class="type-badge text-[9px] uppercase px-1.5 py-0.5 rounded bg-gray-800 text-gray-400 border border-gray-700 font-mono shrink-0">${channel.type}</span>
                    </button>
                `).join('');
            });
        }

        // Initialize Video.js Player instance
        function initVideoJS() {
            if (!vjsPlayer) {
                vjsPlayer = videojs('videojs-player', {
                    autoplay: true,
                    controls: true,
                    responsive: true,
                    fluid: false,
                    liveui: true
                });
            }
        }

        // Play Selected Stream (Video.js HLS or iframe)
        function playStream(segKey, channelId) {
            const channel = channelsData[segKey].find(c => c.id === channelId);
            if (!channel) return;

            currentActiveStream = { segKey, channel };

            const titleEl = document.getElementById('currentChannelTitle');
            const badgeEl = document.getElementById('channelBadge');
            const placeholderEl = document.getElementById('playerPlaceholder');
            const vjsWrapper = document.getElementById('videojs-wrapper');
            const iframeVideo = document.getElementById('iframePlayer');

            titleEl.innerHTML = `<i class="fa-solid fa-circle-play text-emerald-400"></i> ${channel.name} <span class="text-xs text-gray-400 font-normal">(${channel.tag})</span>`;
            badgeEl.classList.remove('hidden');
            placeholderEl.classList.add('hidden');

            // Active button highlight
            document.querySelectorAll('.channel-btn').forEach(btn => {
                btn.classList.remove('border-cyan-500', 'bg-cyan-950/40', 'text-cyan-300');
            });

            const activeBtn = document.getElementById(`btn-${channel.id}`);
            if (activeBtn) {
                activeBtn.classList.add('border-cyan-500', 'bg-cyan-950/40', 'text-cyan-300');
            }

            if (channel.type === 'm3u8') {
                // Hide iframe player
                iframeVideo.classList.add('hidden');
                iframeVideo.src = '';

                // Show Video.js Player
                vjsWrapper.classList.remove('hidden');
                initVideoJS();

                vjsPlayer.src({
                    src: channel.src,
                    type: 'application/x-mpegURL'
                });
                vjsPlayer.play();

            } else if (channel.type === 'iframe') {
                // Pause and hide Video.js player if active
                if (vjsPlayer) {
                    vjsPlayer.pause();
                }
                vjsWrapper.classList.add('hidden');

                // Display iframe
                iframeVideo.classList.remove('hidden');
                iframeVideo.src = channel.src;
            }

            if (window.innerWidth < 1024) {
                toggleSidebar();
            }
        }

        // Refresh Current Stream
        function refreshCurrentStream() {
            if (currentActiveStream) {
                playStream(currentActiveStream.segKey, currentActiveStream.channel.id);
            }
        }

        // Fullscreen Controls
        function toggleFullscreen() {
            const iframeVideo = document.getElementById('iframePlayer');
            const vjsWrapper = document.getElementById('videojs-wrapper');

            if (!vjsWrapper.classList.contains('hidden') && vjsPlayer) {
                if (vjsPlayer.isFullscreen()) {
                    vjsPlayer.exitFullscreen();
                } else {
                    vjsPlayer.requestFullscreen();
                }
            } else if (!iframeVideo.classList.contains('hidden')) {
                if (iframeVideo.requestFullscreen) iframeVideo.requestFullscreen();
            }
        }

        // Filter Channels in Sidebar
        function filterChannels() {
            const query = document.getElementById('channelSearch').value.toLowerCase();
            document.querySelectorAll('.channel-btn').forEach(btn => {
                const text = btn.textContent.toLowerCase();
                if (text.includes(query)) {
                    btn.style.display = 'flex';
                } else {
                    btn.style.display = 'none';
                }
            });
        }

        // Toggle Sidebar on Mobile
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        window.onload = function() {
            renderSidebarChannels();
        };
    </script>
</body>
</html>
